<!DOCTYPE html>
<html lang="es-AR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Página no encontrada | Amarena Pastelería Artesanal</title>
  <meta name="robots" content="noindex, follow">
  <link rel="icon" type="image/png" href="/assets/img/icon-192x192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Lora:ital,wght@0,400;0,500;1,400&family=Playfair+Display:ital,wght@0,600;0,700;1,400&display=swap" rel="stylesheet">
  <style>
    :root {
      --cream-bg: #fcfaf7;
      --brown-deep: #2c1810;
      --brown-mid: #5c3a21;
      --rose: #c0515a;
      --rose-light: #d66a73;
      --gold: #b8956a;
      --text: #4a3627;
      --text-light: #7c6755;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: var(--cream-bg);
      color: var(--text);
      font-family: 'Lora', Georgia, serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem 1.5rem;
      text-align: center;
      background-image: radial-gradient(rgba(184, 149, 106, 0.08) 1px, transparent 0);
      background-size: 24px 24px;
    }
    .container {
      max-width: 580px;
      background: #ffffff;
      border: 1px solid rgba(184, 149, 106, 0.25);
      border-radius: 20px;
      padding: 3.5rem 2.5rem;
      box-shadow: 0 12px 40px rgba(44, 24, 16, 0.08);
      position: relative;
    }
    .logo {
      height: 60px;
      width: auto;
      margin-bottom: 1.8rem;
    }
    .ornament {
      color: var(--gold);
      font-size: 1.4rem;
      margin-bottom: 0.5rem;
    }
    .error-code {
      font-family: 'Playfair Display', Georgia, serif;
      font-size: 5.5rem;
      font-weight: 700;
      color: var(--rose);
      line-height: 1;
      margin-bottom: 0.8rem;
      letter-spacing: -2px;
    }
    h1 {
      font-family: 'Playfair Display', Georgia, serif;
      font-size: 1.8rem;
      color: var(--brown-deep);
      margin-bottom: 1rem;
      font-weight: 600;
    }
    p {
      color: var(--text-light);
      font-size: 1rem;
      line-height: 1.7;
      margin-bottom: 2rem;
    }
    .btn-home {
      display: inline-flex;
      align-items: center;
      gap: 0.6rem;
      background: var(--rose);
      color: #ffffff;
      text-decoration: none;
      padding: 0.85rem 2.4rem;
      border-radius: 30px;
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: 1rem;
      font-weight: 600;
      letter-spacing: 2px;
      text-transform: uppercase;
      transition: background 0.25s, transform 0.2s, box-shadow 0.25s;
      box-shadow: 0 4px 14px rgba(192, 81, 90, 0.25);
    }
    .btn-home:hover {
      background: var(--rose-light);
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(192, 81, 90, 0.35);
    }
    .footer-note {
      margin-top: 2rem;
      font-size: 0.85rem;
      color: var(--gold);
      letter-spacing: 1px;
      text-transform: uppercase;
      font-family: 'Cormorant Garamond', Georgia, serif;
    }
  </style>
</head>
<body>
  <main class="container">
    <a href="/" aria-label="Ir al inicio de Amarena Pastelería">
      <img src="/assets/img/amarena-pasteleria-logo.png" alt="Amarena Pastelería Artesanal" class="logo">
    </a>
    <div class="ornament" aria-hidden="true">✦ ✦ ✦</div>
    <div class="error-code">404</div>
    <h1>Esta delicia no está en nuestro horno</h1>
    <p>
      La página o receta que estás buscando no existe o cambió de lugar. No te preocupes, el resto de nuestras tortas y mesas dulces te están esperando.
    </p>
    <a href="/" class="btn-home">
      <span>Volver al inicio</span>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="m9 18 6-6-6-6"/>
      </svg>
    </a>
    <div class="footer-note">
      Amarena Pastelería Artesanal &bull; Córdoba Capital
    </div>
  </main>
</body>
</html>
